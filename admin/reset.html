<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'; base-uri 'self'">
  <meta name="robots" content="noindex, nofollow">
  <title>New password | Admin</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#004D3B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="S&amp;S Admin">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/space-grotesk-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body login-body">
  <div class="login-patches" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="login-layout">
    <aside class="login-brand">
      <img src="../assets/img/photo-plate-800.webp" alt="">
      <div class="login-brand-text">
        <p class="login-wordmark">Steam &amp; Spice</p>
        <p>Taste like Nepal.</p>
      </div>
    </aside>
    <main class="login-main" id="main">
      <div class="login-card">
        <p class="admin-brand login-mark">Steam &amp; Spice</p>
        <h1>New password</h1>
        <p class="login-note" role="status" data-message></p>
        <form data-reset-form hidden novalidate>
          <div class="field"><label for="new-password">New password</label>
            <div class="password-wrap"><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" data-toggle-password>Show</button></div>
            <p class="hint">At least 10 characters.</p></div>
          <div class="field"><label for="confirm-password">Repeat the new password</label><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" required></div>
          <button class="btn btn-big" type="submit" data-submit>Save new password</button>
          <p class="error" role="alert" data-error></p>
        </form>
        <p class="login-links"><a href="login.html">Back to log in</a></p>
      </div>
    </main>
  </div>
  <script type="module" src="js/reset.js"></script>
</body>
</html>
