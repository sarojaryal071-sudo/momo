<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'; base-uri 'self'">
  <meta name="robots" content="noindex, nofollow">
  <title>New password | Admin</title>
  <script src="js/boot-guard.js"></script>
  <script src="../js/clean-url.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#004D3B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="S&amp;S Admin">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preload" href="../assets/fonts/space-grotesk-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body login-body">
  <div class="bg-patches" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  
  <div class="login-layout">
    <aside class="login-brand">
      <img src="../assets/img/photo-plate-800.webp" alt="A plate of steamed momo with a small bowl of red sauce" loading="eager">
      <div class="login-brand-text">
        <p class="login-wordmark">Steam &amp; Spice</p>
        <p class="login-tagline"><span>Taste like Nepal</span></p>
      </div>
    </aside>
    <main class="login-main" id="main">
      <div class="login-card">
        <p class="admin-brand login-mark">Steam &amp; Spice</p>
        <p class="login-tagline login-tagline-card"><span>Taste like Nepal</span></p>
        <h1>New password</h1>
        <p class="login-note" role="status" data-message></p>
        <form data-reset-form hidden novalidate>
          <div class="field"><label for="new-password">New password</label>
            <div class="password-wrap icon-field"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" data-toggle-password><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5c1.6 0 3 .5 4.3 1.2M21.5 12S18 18.5 12 18.5c-1.6 0-3-.5-4.3-1.2"/><path d="M4 4l16 16"/></svg></button></div>
            <p class="hint">At least 10 characters.</p></div>
          <div class="field"><label for="confirm-password">Repeat the new password</label><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" required></div>
          <button class="btn btn-big" type="submit" data-submit>Save new password</button>
          <p class="error" role="alert" data-error></p>
        </form>
        <p class="login-links"><a href="login">Back to log in</a></p>
      </div>
    </main>
  </div>
  <script type="module" src="js/reset.js"></script>
</body>
</html>
