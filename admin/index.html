<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'self'; base-uri 'self'">
  <meta name="robots" content="noindex, nofollow">
  <title>Orders | Admin</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/hanken-grotesk-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-auth data-page="orders">
  <header class="admin-bar">
    <span class="admin-title">Steam &amp; Spice admin</span>
    <button type="button" class="btn btn-secondary btn-small" data-logout>Log out</button>
    <p class="demo-banner" data-demo-banner hidden><strong>Demo mode.</strong> Orders and settings are saved in this browser only. Nothing is sent to customers.</p>
  </header>
  <nav class="tabbar" aria-label="Admin">
    <a href="index.html" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders</a>
    <a href="prep.html" data-tab="prep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><path d="M18 15l2 2 3-4" transform="translate(-2 0)"/></svg>Prep</a>
    <a href="products.html" data-tab="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14c0-5 4.5-9 9-9s9 4 9 9c-3 3-15 3-18 0z"/><path d="M12 6v10"/></svg>Products</a>
    <a href="pickup.html" data-tab="pickup"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Pickup</a>
    <a href="settings.html" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Settings</a>
  </nav>
  <main class="admin-main" id="main">
    <h1>Orders</h1>
    <div class="new-count" data-new-count><strong data-new-number>0</strong><span>new orders waiting</span></div>
    <form class="filters no-print" data-filters>
      <div class="field"><label for="f-from">From</label><input id="f-from" type="date" data-from></div>
      <div class="field"><label for="f-to">To</label><input id="f-to" type="date" data-to></div>
      <div class="field"><label for="f-status">Status</label>
        <select id="f-status" data-status><option value="active">Open orders</option><option value="all">All</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="ready">Ready</option><option value="collected">Collected</option><option value="cancelled">Cancelled</option></select></div>
    </form>
    <p class="btn-row"><a class="btn btn-secondary btn-small" href="prep.html">Prep list</a><button type="button" class="btn btn-secondary btn-small" data-all-dates>Show past orders too</button></p>
    <div data-orders aria-live="polite"></div>
    <p class="muted" data-empty hidden>No orders match.</p>
  </main>
  <script type="module" src="js/orders.js"></script>
</body>
</html>
