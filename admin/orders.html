<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'; base-uri 'self'">
  <meta name="robots" content="noindex, nofollow">
  <title>Orders | Admin</title>
  <script src="js/boot-guard.js"></script>
  <script src="../js/clean-url.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#004D3B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="S&amp;S Admin">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/space-grotesk-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-auth data-page="orders">
  <div class="bg-patches" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="top-stack">
  <div class="paused-strip" data-paused hidden role="status"><span><strong>Ordering is paused.</strong> Customers cannot place orders.</span><button type="button" class="btn btn-small btn-secondary" data-resume>Resume</button></div>
  <header class="admin-bar">
    <a class="admin-brand" href="./">Steam &amp; Spice</a>
    <div class="admin-actions">
      <button type="button" class="icon-btn" aria-expanded="false" aria-controls="logout-confirm" data-logout-btn><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M14 8l4 4-4 4M18 12H9"/></svg><span class="visually-hidden">Log out</span></button>
      <div class="admin-menu" id="logout-confirm" role="alertdialog" aria-label="Log out" hidden>
        <p>Log out?</p>
        <div class="btn-row"><button type="button" class="btn btn-small" data-logout>Log out</button><button type="button" class="btn btn-secondary btn-small" data-logout-cancel>Cancel</button></div>
      </div>
    </div>
  </header>
  </div>
    <nav class="tabbar" aria-label="Admin">
    <a href="./" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg>Home</a>
    <a href="orders" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders</a>
    <a href="products" data-tab="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14c0-5 4.5-9 9-9s9 4 9 9c-3 3-15 3-18 0z"/><path d="M12 6v10"/></svg>Products</a>
    <a href="pickup" data-tab="pickup"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Pickup</a>
    <a href="settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Settings</a>
  </nav>
  <main class="admin-main" id="main">
    <div class="title-row">
      <h1>Orders</h1>
      <span class="new-badge" data-new-count hidden><span data-new-number>0</span> new</span>
      <span class="live-status" data-live hidden>Reconnecting…</span>
      <a class="btn btn-secondary btn-small" href="prep">Prep list</a>
    </div>
    <div class="btn-row no-print"><a class="btn btn-small" href="new-order">New order</a></div>
    <form class="filters no-print" data-filters>
      <div class="field"><label for="f-status">Status</label>
        <select id="f-status" data-status><option value="active">Open</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="ready">Ready</option><option value="collected">Collected</option><option value="cancelled">Cancelled</option><option value="all">All</option></select></div>
      <div class="field"><label for="f-when">When</label>
        <select id="f-when" data-when><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="week">This week</option><option value="upcoming" selected>All upcoming</option><option value="past">Past</option><option value="all">Any date</option><option value="custom">Custom range</option></select></div>
    </form>
    <div class="form-grid custom-range no-print" data-custom hidden>
      <div class="field"><label for="f-from">From</label><input id="f-from" type="date" data-from></div>
      <div class="field"><label for="f-to">To</label><input id="f-to" type="date" data-to></div>
    </div>
    <details class="date-range no-print">
      <summary>Export orders (CSV)</summary>
      <p class="hint">Download a spreadsheet file of your orders. Keep one each week as your backup.</p>
      <div class="form-grid">
        <div class="field"><label for="x-from">Pickup from</label><input id="x-from" type="date" data-export-from></div>
        <div class="field"><label for="x-to">Pickup to</label><input id="x-to" type="date" data-export-to></div>
      </div>
      <div class="btn-row"><button type="button" class="btn btn-secondary btn-small" data-export>Download CSV</button><span class="saved" role="status" data-export-msg></span></div>
    </details>
    <div data-orders aria-live="polite"></div>
    <p class="muted empty-state" data-empty hidden>No orders yet.</p>
  </main>
  <script type="module" src="js/orders.js"></script>
</body>
</html>
