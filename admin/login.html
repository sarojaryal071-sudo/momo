<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'; base-uri 'self'">
  <meta name="robots" content="noindex, nofollow">
  <title>Log in | Admin</title>
  <script src="js/boot-guard.js"></script>
  <script src="../js/clean-url.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#004D3B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="S&amp;S Admin">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preload" href="../assets/fonts/space-grotesk-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body login-body">
  <div class="bg-patches" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  
  <div class="login-layout">
    <aside class="login-brand">
      <img src="../assets/img/photo-plate-800.webp" alt="A plate of steamed momo with a small bowl of red sauce" loading="eager">
      <div class="login-brand-text"><span class="logo-plate"><img class="login-full" src="../assets/img/logo-full-240.webp" srcset="../assets/img/logo-full-240.webp 240w, ../assets/img/logo-full-480.webp 480w, ../assets/img/logo-full-960.webp 960w" sizes="12rem" width="240" height="223" alt="Steam &amp; Spice"></span></div>
    </aside>
    <main class="login-main" id="main">
      <div class="login-card">
        <img class="login-logo" src="../assets/img/logo-full-480.webp" srcset="../assets/img/logo-full-240.webp 240w, ../assets/img/logo-full-480.webp 480w" sizes="12rem" width="480" height="446" alt="Steam &amp; Spice">
        <h1>Admin</h1>
        <p class="login-note" role="status" data-message hidden></p>
        <form data-login novalidate>
          <div class="field"><label for="email">Email</label><div class="icon-field"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg><input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></div></div>
          <div class="field"><label for="password">Password</label>
            <div class="password-wrap icon-field"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" data-toggle-password><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5c1.6 0 3 .5 4.3 1.2M21.5 12S18 18.5 12 18.5c-1.6 0-3-.5-4.3-1.2"/><path d="M4 4l16 16"/></svg></button></div>
          </div>
          <button class="btn btn-big" type="submit" data-submit>Log in</button>
          <p class="error" role="alert" data-error></p>
          <p class="login-links"><button type="button" class="link-button" data-forgot>Forgot password?</button></p>
        </form>
        <form data-forgot-form hidden novalidate>
          <p>Enter your email and we will send a link to choose a new password.</p>
          <div class="field"><label for="reset-email">Email</label><div class="icon-field"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg><input id="reset-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></div></div>
          <button class="btn btn-big" type="submit" data-reset-submit>Send reset link</button>
          <p class="login-note" role="status" data-reset-message></p>
          <p class="error" role="alert" data-reset-error></p>
          <p class="login-links"><button type="button" class="link-button" data-back>Back to log in</button></p>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
